<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16173D">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Free, legal films and series: full episodes from official channels, public-domain classics, and where to watch everything else.">
  <title>UwatchMe</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="UwatchMe">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&family=Reem+Kufi:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#/" aria-label="UwatchMe"><img src="/icons/mark.svg" alt="" width="28" height="28"><span class="brand-name">UwatchMe</span></a>
    <nav class="nav" id="nav" aria-label="Main navigation"></nav>
    <div class="top-actions">
      <a class="icon-btn" href="#/search" id="btn-search" aria-label="Search"></a>
      <a class="icon-btn" href="#/settings" id="btn-settings" aria-label="Settings"></a>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">UwatchMe needs JavaScript to run.</p></noscript>

  <script src="/js/i18n.js"></script>
  <script src="/js/core.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/views.js"></script>
  <script src="/js/detail.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
